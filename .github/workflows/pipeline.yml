name: Weekly EIA Petroleum Pipeline

on:
  # Automated schedule: Every Wednesday at 15:35 UTC (11:35 AM EDT / 10:35 AM EST)
  schedule:
    - cron: '35 15 * * 3'

  # Manual trigger: Allows running the pipeline on-demand from the GitHub Actions tab
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run EIA Data Pipeline
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: |
          python pipeline.py

      - name: Commit and Push Updated Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/latest_inventory.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "data: update weekly petroleum inventory [skip ci]" && git push)

      - name: Upload SQLite Database Artifact
        uses: actions/upload-artifact@v4
        with:
          name: eia-inventory-database
          path: inventory.db
