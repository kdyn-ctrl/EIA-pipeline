name: Weekly EIA Petroleum Pipeline

on:
  # Automated schedule: Every Wednesday at 15:35 UTC (11:35 AM EDT / 10:35 AM EST)
  schedule:
    - cron: '35 15 * * 3'

  # Manual trigger: Allows running the pipeline on-demand from the GitHub Actions tab
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run EIA Data Pipeline
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: |
          python pipeline.py
